# -Xmx8G era el valor de la plantilla de Flutter. Bajado a 4G: esta maquina
# no lo necesita y el daemon reservandose 8G compite con el resto.
# preferIPv4Stack: sin esto Gradle falla con "Unable to establish loopback
# connection" en Windows 11, porque resuelve localhost por IPv6 y no logra
# hablar con sus propios procesos worker.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
