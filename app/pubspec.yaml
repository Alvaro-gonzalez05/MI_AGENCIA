name: mi_agencia
description: "ERP para agencias de autos usados"
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Textos de Material en castellano (botones de dialogos, selector de fechas).
  flutter_localizations:
    sdk: flutter

  # Navegacion declarativa. Hace falta de verdad, no por moda: la app tiene
  # deep links (abrir la ficha de un vehiculo desde un mail de campana) y el
  # guard de sesion se resuelve en un solo lugar con redirect.
  go_router: ^17.2.1

  # Estado. Riverpod en vez de Provider porque los providers son objetos
  # globales tipados: no dependen de la posicion en el arbol de widgets, que
  # es justo lo que rompe cuando el shell cambia entre movil y escritorio.
  flutter_riverpod: ^3.0.3

  # Backend.
  supabase_flutter: ^2.11.1

  # Lo referencian plugins que traen IconData de Cupertino. Sin el, el paso
  # de tree-shaking de iconos del build release falla.
  cupertino_icons: ^1.0.8

  # Abre la descarga de una version nueva en Android. Supabase ya lo trae
  # como dependencia; se declara porque la app lo usa directamente.
  url_launcher: ^6.3.1

  # Formato de numeros y fechas en es-AR ($ y separador de miles con punto).
  intl: ^0.20.2

  # Informe crediticio en PDF. `pdf` arma el documento y `printing` lo abre,
  # lo imprime o lo comparte con lo que el sistema tenga: en Windows el
  # visor de PDF, en Android la hoja de compartir para mandarlo por WhatsApp,
  # que es como una agencia lo va a usar de verdad.
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Genera el icono en todos los tamanos que pide cada plataforma a partir de
  # los dos PNG maestros. Es dev_dependency: corre una vez al cambiar el
  # icono y no viaja en la app.
  flutter_launcher_icons: ^0.14.4

# El icono. Los maestros los dibuja scripts/generar_icono.py; esto los baja a
# los catorce tamanos que piden Android y Windows:
#
#     python scripts/generar_icono.py
#     cd app && dart run flutter_launcher_icons
#
# El icono adaptativo de Android va aparte porque el launcher recorta los
# bordes con la forma que tenga (circulo, gota, cuadrado redondeado): la
# marca entra mas chica para que no le corte la cabeza, y el fondo lo pone
# el sistema con el color plano.
flutter_launcher_icons:
  image_path: "assets/icono/icono.png"
  android: true
  adaptive_icon_background: "#131315"
  adaptive_icon_foreground: "assets/icono/icono_frente.png"
  windows:
    generate: true
    image_path: "assets/icono/icono.png"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/fuentes/
    - assets/icono/icono.png

  # Empaquetadas en vez de descargadas en runtime (google_fonts): la app tiene
  # que verse igual en Windows, Android y web, y funcionar sin internet.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fuentes/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fuentes/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fuentes/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fuentes/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fuentes/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fuentes/IBMPlexMono-SemiBold.ttf
          weight: 600
