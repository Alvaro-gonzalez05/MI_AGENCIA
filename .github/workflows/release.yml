name: Publicar instaladores

# Compila la app y publica los instaladores en Releases.
#
# Windows se compila ACA y no en la maquina de desarrollo a proposito: el
# runner de GitHub ya trae Visual Studio con la carga de C++ (unos 10 GB que
# Flutter exige para Windows), asi no hay que instalarla localmente.
#
# Se dispara de dos formas:
#   - al empujar un tag v*  (ej: git tag v0.1.0 && git push origin v0.1.0)
#   - a mano desde la pestaña Actions (workflow_dispatch)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: app
        run: flutter pub get

      - name: Analisis
        working-directory: app
        run: flutter analyze

      - name: Tests
        working-directory: app
        run: flutter test

      # La app necesita saber que version es para compararla con la ultima
      # publicada. Sale del tag: v0.3.0 -> 0.3.0.
      - name: Version desde el tag
        run: |
          VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validar configuracion de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: test -n "$SUPABASE_URL" && test -n "$SUPABASE_ANON_KEY"

      - name: Preparar firma estable de Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/android/mi-agencia-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/app/android/mi-agencia-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      # La validación anterior impide distribuir una demo accidentalmente.
      - name: Compilar APK
        working-directory: app
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Renombrar para que se entienda cual bajar
        run: |
          cd app/build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk   MiAgencia-Android-arm64.apk
          mv app-armeabi-v7a-release.apk MiAgencia-Android-arm32.apk
          rm -f app-x86_64-release.apk *.sha1

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/build/app/outputs/flutter-apk/MiAgencia-Android-*.apk

  windows:
    name: Windows (instalador)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: app
        run: flutter pub get

      - name: Version desde el tag
        run: |
          $version = ((Get-Content app/pubspec.yaml | Select-String '^version:').Line -replace '^version:\s*','').Split('+')[0]
          if ($env:GITHUB_REF.StartsWith('refs/tags/v')) { $version = $env:GITHUB_REF_NAME.Substring(1) }
          "APP_VERSION=$version" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        shell: pwsh

      - name: Validar configuracion de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if (-not $env:SUPABASE_URL -or -not $env:SUPABASE_ANON_KEY) { throw 'Falta la configuracion de Supabase para el instalador.' }
        shell: pwsh

      - name: Compilar Windows
        working-directory: app
        run: >
          flutter build windows --release
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          --dart-define=APP_VERSION=${{ env.APP_VERSION }}

      - name: Armar el instalador con Inno Setup
        run: |
          $version = $env:APP_VERSION
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DMiVersion=$version `
            installer\mi_agencia.iss
        shell: pwsh

      # El ZIP portable es para quien no quiere o no puede instalar nada:
      # se descomprime y se ejecuta. Util en PCs de agencia con restricciones.
      - name: Armar tambien un ZIP portable
        run: |
          Compress-Archive -Path app\build\windows\x64\runner\Release\* `
                           -DestinationPath "installer\salida\MiAgencia-Windows-portable.zip"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: installer/salida/*

  publicar:
    name: Publicar en Releases
    needs: [android, windows]
    runs-on: ubuntu-latest
    # Solo cuando hay un tag: una corrida a mano deja los archivos como
    # artefactos del workflow, sin crear un release a medio hacer.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # El repo hace falta solo para leer el mensaje del tag (notas de la
      # version y la marca [obligatoria]).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # checkout convierte los tags anotados en livianos y se pierde el
      # mensaje: se vuelve a traer el tag tal cual.
      - name: Traer el tag con su mensaje
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v4
        with:
          path: entrega

      - name: Crear el release
        uses: softprops/action-gh-release@v2
        with:
          name: Mi Agencia ${{ github.ref_name }}
          generate_release_notes: true
          files: entrega/**/*
          body: |
            ## Descargas

            | Si tenés… | Bajá esto |
            |---|---|
            | **Windows** | `MiAgencia-Setup-*.exe` — instalador, crea acceso directo y se desinstala desde Panel de control |
            | **Windows sin permisos de instalación** | `MiAgencia-Windows-portable.zip` — descomprimir y ejecutar |
            | **Android** (casi todos los celulares desde 2017) | `MiAgencia-Android-arm64.apk` |
            | **Android viejo** (32 bits) | `MiAgencia-Android-arm32.apk` |

            La app avisa sola cuando hay una versión nueva y abre la descarga
            con un botón. En Windows el instalador actualiza la versión existente.

            > **Android:** las versiones anteriores a la 0.5.0 eran pruebas con
            > una firma temporal. Hay que desinstalarlas una única vez antes de
            > instalar la 0.5.0. Desde esta versión la firma es estable y las
            > siguientes actualizaciones se instalan encima normalmente.

            > El APK no está firmado con una clave de Play Store, así que Android
            > va a pedir permiso para instalar desde fuera de la tienda. Es
            > esperable mientras la app no esté publicada.

      # Actualizaciones automaticas: sube los instaladores a Storage y
      # reescribe ultima.json, que es lo que consultan las apps instaladas.
      #
      # Para marcar una version como OBLIGATORIA (la app no deja seguir hasta
      # actualizar), publicarla con un tag anotado que diga [obligatoria]:
      #   git tag -a v0.4.0 -m "[obligatoria] Cambios en la base"
      # El resto del mensaje se muestra como notas en el aviso.
      - name: Subir a Supabase para las actualizaciones automaticas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::warning::Faltan los secretos SUPABASE_URL o SUPABASE_SERVICE_ROLE_KEY. La version quedo en GitHub, pero las apps instaladas no se van a enterar."
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          BUCKET=instaladores
          BASE="${SUPABASE_URL%/}/storage/v1"
          PUBLICA="$BASE/object/public/$BUCKET"

          # Las claves nuevas (sb_secret_...) van solo como apikey; las viejas
          # (JWT de service_role) ademas como Bearer.
          AUTH=(-H "apikey: $SUPABASE_SERVICE_KEY")
          case "$SUPABASE_SERVICE_KEY" in
            eyJ*) AUTH+=(-H "Authorization: Bearer $SUPABASE_SERVICE_KEY") ;;
          esac

          # La primera vez crea el bucket. Si ya existe, responde error y se sigue.
          curl -sS -X POST "$BASE/bucket" "${AUTH[@]}" \
            -H "Content-Type: application/json" \
            -d "{\"id\":\"$BUCKET\",\"name\":\"$BUCKET\",\"public\":true}" || true
          echo

          subir() { # origen destino tipo cache
            curl -sS --fail-with-body -X POST "$BASE/object/$BUCKET/$2" "${AUTH[@]}" \
              -H "Content-Type: $3" -H "x-upsert: true" -H "cache-control: $4" \
              --data-binary "@$1"
            echo
          }

          SETUP="$(ls entrega/windows/MiAgencia-Setup-*.exe)"
          SETUP_NOMBRE="$(basename "$SETUP")"
          APK=application/vnd.android.package-archive
          PARA_SIEMPRE="public, max-age=31536000"

          # Primero los instaladores y al final la ficha: una app nunca tiene
          # que enterarse de una version cuyos archivos todavia no estan.
          subir "$SETUP" "$VERSION/$SETUP_NOMBRE" application/octet-stream "$PARA_SIEMPRE"
          subir entrega/android/MiAgencia-Android-arm64.apk "$VERSION/MiAgencia-Android-arm64.apk" "$APK" "$PARA_SIEMPRE"
          subir entrega/android/MiAgencia-Android-arm32.apk "$VERSION/MiAgencia-Android-arm32.apk" "$APK" "$PARA_SIEMPRE"

          MENSAJE="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP/,$d')"
          OBLIGATORIA=false
          if printf '%s' "$MENSAJE" | grep -qi '\[obligatoria\]'; then OBLIGATORIA=true; fi
          NOTAS="$(printf '%s' "$MENSAJE" | sed 's/\[obligatoria\]//Ig' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          jq -n \
            --arg version "$VERSION" \
            --arg fecha "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notas "$NOTAS" \
            --argjson obligatoria "$OBLIGATORIA" \
            --arg windows "$PUBLICA/$VERSION/$SETUP_NOMBRE" \
            --arg arm64 "$PUBLICA/$VERSION/MiAgencia-Android-arm64.apk" \
            --arg arm32 "$PUBLICA/$VERSION/MiAgencia-Android-arm32.apk" \
            '{version: $version, fecha: $fecha, notas: $notas,
              obligatoria: $obligatoria, windows: $windows,
              android_arm64: $arm64, android_arm32: $arm32}' > ultima.json
          cat ultima.json

          subir ultima.json ultima.json application/json "no-cache, max-age=0"
