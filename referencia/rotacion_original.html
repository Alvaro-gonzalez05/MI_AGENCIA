<title>ERP Agencias de Autos</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ============ TOKENS ============ */
  :root{
    color-scheme: light;
    --surface:        #eef1f6;
    --surface-card:   #ffffff;
    --surface-sunken: #f4f6f9;
    --surface-hover:  #e7ebf1;
    --border:         #dbe1e9;
    --border-strong:  #c3ccd8;
    --ink:            #12161f;
    --ink-2:          #4c5666;
    --ink-3:          #838da0;
    --accent:         #1c5cab;
    --accent-ink:     #ffffff;
    --accent-wash:    #e7f0fb;
    --good:           #0ca30c;
    --good-wash:      #e4f6e2;
    --warning:        #b3790a;
    --warning-wash:   #fdf1d9;
    --serious:        #c85a34;
    --serious-wash:   #fbe6dc;
    --critical:       #d03b3b;
    --critical-wash:  #fbe1e1;
    --shadow: 0 1px 2px rgba(18,22,31,0.04), 0 8px 24px -12px rgba(18,22,31,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --surface:        #0e1116;
      --surface-card:   #171b23;
      --surface-sunken: #12151b;
      --surface-hover:  #1e2430;
      --border:         #262c38;
      --border-strong:  #333c4b;
      --ink:            #e9edf4;
      --ink-2:          #aab4c4;
      --ink-3:          #757f92;
      --accent:         #5b93e0;
      --accent-ink:     #0b1220;
      --accent-wash:    #17253a;
      --good:           #3ec46b;
      --good-wash:      #123321;
      --warning:        #f0b429;
      --warning-wash:   #3a2c0d;
      --serious:        #f0895c;
      --serious-wash:   #3a2213;
      --critical:       #ef6a6a;
      --critical-wash:  #3a1616;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --surface:        #0e1116;
    --surface-card:   #171b23;
    --surface-sunken: #12151b;
    --surface-hover:  #1e2430;
    --border:         #262c38;
    --border-strong:  #333c4b;
    --ink:            #e9edf4;
    --ink-2:          #aab4c4;
    --ink-3:          #757f92;
    --accent:         #5b93e0;
    --accent-ink:     #0b1220;
    --accent-wash:    #17253a;
    --good:           #3ec46b;
    --good-wash:      #123321;
    --warning:        #f0b429;
    --warning-wash:   #3a2c0d;
    --serious:        #f0895c;
    --serious-wash:   #3a2213;
    --critical:       #ef6a6a;
    --critical-wash:  #3a1616;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--surface);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{font-family:"Oswald", "IBM Plex Sans", sans-serif; text-transform:uppercase; letter-spacing:.02em;}
  .mono{font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--accent);}
  button{font-family:inherit;}
  ::selection{background:var(--accent-wash);}

  /* ============ SHELL ============ */
  #app{display:flex; min-height:100vh;}

  .sidebar{
    width:216px; flex:none;
    background:var(--surface-card);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:22px 20px 16px;
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark{
    width:30px;height:30px;border-radius:7px;
    background:var(--accent); color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;
    flex:none;
  }
  .brand-name{font-family:"Oswald",sans-serif; font-size:19px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;}
  .brand-tag{font-size:10.5px; color:var(--ink-3); letter-spacing:.03em; margin-top:1px;}

  nav.mainnav{padding:6px 10px; display:flex; flex-direction:column; gap:2px; flex:1;}
  .navlink{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px; border-radius:8px;
    color:var(--ink-2); font-size:13.5px; font-weight:500;
    cursor:pointer; border:1px solid transparent;
    user-select:none;
  }
  .navlink svg{width:16px;height:16px;flex:none;opacity:.85;}
  .navlink:hover{background:var(--surface-hover); color:var(--ink);}
  .navlink.active{background:var(--accent-wash); color:var(--accent); font-weight:600;}
  .navlink.active svg{opacity:1;}
  .navgroup-label{font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.08em; padding:14px 12px 4px;}

  .sidebar-foot{
    padding:14px 18px 18px; border-top:1px solid var(--border);
    font-size:11.5px; color:var(--ink-3);
  }

  .content{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; border-bottom:1px solid var(--border);
    background:var(--surface-card);
    position:sticky; top:0; z-index:5;
    gap:16px; flex-wrap:wrap;
  }
  .topbar h1{font-size:19px; margin:0; font-weight:600; letter-spacing:.02em;}
  .topbar .sub{font-size:12px; color:var(--ink-3); text-transform:none; letter-spacing:0; font-family:"IBM Plex Sans",sans-serif; margin-top:2px;}
  .topbar-right{display:flex; align-items:center; gap:10px;}

  .pane{padding:24px 28px 60px; max-width:1280px;}
  .pane[hidden]{display:none;}

  /* ============ PRIMITIVES ============ */
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:8px;
    background:var(--surface-sunken); color:var(--ink);
    border:1px solid var(--border-strong);
    font-size:13px; font-weight:500; cursor:pointer;
  }
  .btn:hover{background:var(--surface-hover);}
  .btn-accent{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--ink-2);}
  .btn-ghost:hover{background:var(--surface-hover);}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:6px;}

  .card{
    background:var(--surface-card);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
  }
  .section-title{font-size:13px; font-weight:600; margin:0 0 2px; letter-spacing:.02em;}
  .section-note{font-size:12px; color:var(--ink-3); margin:0 0 14px; text-transform:none; font-family:"IBM Plex Sans",sans-serif; letter-spacing:0;}

  .grid{display:grid; gap:14px;}
  .grid-stats{grid-template-columns:repeat(4,1fr);}
  .grid-2{grid-template-columns:1fr 1fr;}
  @media (max-width:1050px){ .grid-stats{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;} }

  .stat{padding:16px 18px; display:flex; flex-direction:column; gap:6px;}
  .stat-label{font-size:10.5px; color:var(--ink-3); letter-spacing:.06em; font-weight:600;}
  .stat-value{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-size:22px; font-weight:600; letter-spacing:-.01em;}
  .stat-value.small{font-size:19px;}
  .stat-caption{font-size:11.5px; color:var(--ink-3);}
  .stat-caption.accent{color:var(--accent);}
  .stat-caption.critical{color:var(--critical);}
  .stat-caption.good{color:var(--good);}
  .stat-value.accent{color:var(--accent);}
  .stat-value.critical{color:var(--critical);}
  .stat-value.good{color:var(--good);}

  .pill{
    display:inline-flex; align-items:center; gap:5px;
    padding:3px 9px 3px 7px; border-radius:99px;
    font-size:11.5px; font-weight:600; white-space:nowrap;
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .pill-normal{background:var(--good-wash); color:var(--good);}
  .pill-normal .dot{background:var(--good);}
  .pill-observar{background:var(--warning-wash); color:var(--warning);}
  .pill-observar .dot{background:var(--warning);}
  .pill-atencion{background:var(--serious-wash); color:var(--serious);}
  .pill-atencion .dot{background:var(--serious);}
  .pill-critico{background:var(--critical-wash); color:var(--critical);}
  .pill-critico .dot{background:var(--critical);}
  .pill-vendido{background:var(--accent-wash); color:var(--accent);}
  .pill-vendido .dot{background:var(--accent);}
  .pill-neutral{background:var(--surface-sunken); color:var(--ink-2); border:1px solid var(--border);}

  table{border-collapse:collapse; width:100%; font-size:13px;}
  thead th{
    text-align:left; font-size:10.5px; color:var(--ink-3);
    text-transform:uppercase; letter-spacing:.06em; font-weight:600;
    padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.rowhover:hover{background:var(--surface-sunken); cursor:pointer;}
  td.num, th.num{text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums;}
  .table-wrap{overflow-x:auto; border-radius:12px;}
  .diag{font-size:12px; color:var(--ink-2); max-width:360px; min-width:260px; white-space:normal;}

  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11.5px; color:var(--ink-2); font-weight:600;}
  .field input, .field select{
    padding:8px 10px; border-radius:7px; border:1px solid var(--border-strong);
    background:var(--surface-sunken); color:var(--ink); font-size:13px; font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent);}
  .form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:14px;}
  .form-actions{display:flex; gap:8px; align-items:center;}
  .form-msg{font-size:12px; color:var(--good); font-weight:600;}

  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .kbd{font-family:"IBM Plex Mono",monospace; font-size:11px; background:var(--surface-sunken); border:1px solid var(--border-strong); border-radius:4px; padding:1px 5px;}

  .empty{padding:30px; text-align:center; color:var(--ink-3); font-size:13px;}

  /* charts */
  .chart-tooltip{
    position:absolute; pointer-events:none; z-index:20;
    background:var(--ink); color:var(--surface);
    font-size:11.5px; padding:6px 9px; border-radius:6px;
    box-shadow:var(--shadow); white-space:nowrap; transform:translate(-50%,-115%);
    font-family:"IBM Plex Mono",monospace;
  }
  :root:not([data-theme="light"]) .chart-tooltip{background:var(--surface-card); color:var(--ink); border:1px solid var(--border-strong);}
  :root[data-theme="dark"] .chart-tooltip{background:var(--surface-card); color:var(--ink); border:1px solid var(--border-strong);}
  .barlbl{font-family:"IBM Plex Sans",sans-serif; font-size:11.5px; fill:var(--ink-2);}
  .barval{font-family:"IBM Plex Mono",monospace; font-size:11.5px; fill:var(--ink); font-weight:600;}
  .gridline{stroke:var(--border);}
  .chart-legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-2);}
  .legend-swatch{width:9px;height:9px;border-radius:2px;}

  .config-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 0; border-bottom:1px solid var(--border);}
  .config-row:last-child{border-bottom:none;}
  .config-row .meta{max-width:64%;}
  .config-row .meta .name{font-size:13px; font-weight:600;}
  .config-row .meta .desc{font-size:11.5px; color:var(--ink-3); margin-top:2px;}
  .config-row input{width:120px; text-align:right;}

  .ficha-select{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .ficha-select select{min-width:280px;}

  .metric-block{padding:16px 18px;}
  .metric-block h3{font-size:11px; margin:0 0 12px; color:var(--ink-3); letter-spacing:.06em;}
  .metric-row{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0;}
  .metric-row .k{font-size:12.5px; color:var(--ink-2);}
  .metric-row .v{font-family:"IBM Plex Mono",monospace; font-size:13px; font-weight:600;}

  .diag-banner{
    display:flex; gap:10px; align-items:flex-start;
    padding:12px 14px; border-radius:10px; font-size:12.5px; line-height:1.6;
    background:var(--surface-sunken); border:1px solid var(--border); color:var(--ink-2);
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--surface); padding:10px 18px; border-radius:99px;
    font-size:12.5px; font-weight:500; box-shadow:var(--shadow); z-index:50;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>

  <aside class="sidebar">

  <div class="content">
    <header class="topbar">
      <div>
        <h1 id="pagetitle">Panel</h1>

      </div>
    </header>
    <div id="panes"></div>
  </div>
</div>

<div class="chart-tooltip" id="tooltip" style="display:none;"></div>
<div class="toast" id="toast"></div>

/* ======================================================================
   STORE
====================================================================== */
const STORAGE_KEY = "rotacion_demo_v1";
let DATA = loadData();

function migrarData(data){
  // Compatibilidad con datos guardados antes de agregar interesados/referencias/financiación.
  const seed = seedData();
  if(!Array.isArray(data.interesados)) data.interesados = [];
  if(!Array.isArray(data.referencias)) data.referencias = seed.referencias;
  if(data.config && data.config.tasaFinanciacionMensual===undefined) data.config.tasaFinanciacionMensual = seed.config.tasaFinanciacionMensual;
  return data;
}
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return migrarData(JSON.parse(raw));
  }catch(e){ /* storage unavailable — fall through to seed */ }
  return seedData();
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){ /* ignore */ }
}
function resetData(){
  DATA = seedData();
  saveData();
  render();
  toast("Datos de ejemplo restaurados");
}

/* ======================================================================
   HELPERS
====================================================================== */
function d(str){ return new Date(str+"T00:00:00"); }
function todayDate(){ return new Date(); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function fmtDate(str){ const x=d(str); return x.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function fmtARS(n){
  if(n===null||n===undefined||isNaN(n)) return "—";
  const neg = n<0; n = Math.round(Math.abs(n));
  return (neg?"-":"")+"$ "+n.toLocaleString("es-AR");
}
function fmtUSD(n){
  if(n===null||n===undefined||isNaN(n)) return "—";
  return "US$ "+Math.round(n).toLocaleString("es-AR");
}
function fmtPct(n, dec){
  if(n===null||n===undefined||isNaN(n)) return "—";
  dec = dec===undefined?1:dec;
  return (n*100).toLocaleString("es-AR",{minimumFractionDigits:dec,maximumFractionDigits:dec})+"%";
}
function esc(s){ return (s===undefined||s===null)?"":String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(prefix, list, key){
  const nums = list.map(x=>parseInt(String(x[key]).replace(/\D/g,""),10)||0);
  const n = (nums.length?Math.max(...nums):0)+1;
  return prefix+String(n).padStart(3,"0");
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function roundUp(n, step){ return Math.ceil(n/step)*step; }

/* ======================================================================
   FOTOS — redimensiona en el navegador (canvas) antes de guardar en
   localStorage como base64, para no inflar el almacenamiento.
====================================================================== */
function resizeImageToDataURL(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w>=h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL("image/jpeg", 0.72));
    };
    img.onerror = function(){ cb(null); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ cb(null); };
  reader.readAsDataURL(file);
}

/* ======================================================================
   BACKUP / RESTORE — usa la capability "downloads" del Artifact cuando
   está disponible; si no, cae a un textarea copiable.
====================================================================== */
async function tryDownloadsSave(filename, data){
  try{
    if(!(window.claude && typeof window.claude.use === "function")) return false;
    const downloads = await window.claude.use("downloads");
    if(!downloads) return false;
    await downloads.save({filename, data});
    return true;
  }catch(e){ return false; }
}
function mostrarFallback(texto){
  const fallback = document.getElementById("backupFallback");
  const ta = document.getElementById("backupTextarea");
  if(fallback && ta){
    ta.value = texto;
    fallback.style.display = "block";
    ta.focus(); ta.select();
    toast("Copiá el texto de abajo y guardalo en un archivo");
  }
}
function celdaCSV(v){
  v = (v===null||v===undefined) ? "" : String(v);
  if(/[;"\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function armarCSV(headers, rows){
  return "﻿" + [headers.join(";")].concat(rows.map(r=>r.map(celdaCSV).join(";"))).join("\r\n");
}
async function descargarCSV(filename, headers, rows){
  const csv = armarCSV(headers, rows);
  const ok = await tryDownloadsSave(filename, csv);
  if(ok) toast("Descargado: "+filename);
  else mostrarFallback(csv);
}

/* ======================================================================
   PRECIO DE REFERENCIA — tabla propia editable (ver DATA.referencias).
   No es una conexión en vivo a InfoAuto/InfoUsados: son valores que se
   cargan y actualizan a mano en Configuración.
====================================================================== */
function buscarReferencia(marca, modelo, anio){
  const m = (marca||"").trim().toLowerCase(), mo = (modelo||"").trim().toLowerCase();
  const anioNum = parseInt(anio,10);
  const candidatos = DATA.referencias.filter(r=>r.marca.trim().toLowerCase()===m && r.modelo.trim().toLowerCase()===mo);
  if(!candidatos.length) return null;
  const exacto = candidatos.find(r=>r.anio===anioNum);
  if(exacto) return {precio:exacto.precio, exacto:true, anioRef:exacto.anio, fuente:exacto.fuente, url:exacto.url};
  // sin año exacto: toma el más cercano y ajusta ~6%/año de depreciación estimada
  const masCercano = candidatos.slice().sort((a,b)=>Math.abs(a.anio-anioNum)-Math.abs(b.anio-anioNum))[0];
  const dif = anioNum - masCercano.anio;
  const precioAjustado = masCercano.precio * Math.pow(0.94, dif);
  return {precio:Math.round(precioAjustado/10000)*10000, exacto:false, anioRef:masCercano.anio, fuente:masCercano.fuente, url:masCercano.url};
}

/* ======================================================================
   FINANCIACIÓN — amortización francesa (cuota fija)
====================================================================== */
function calcularCuota(monto, cuotas, tasaMensual){
  // Interés directo/flat sobre el capital total (no amortización francesa): la tasa
  // se aplica siempre sobre el monto original, no sobre saldo decreciente. Es el método
  // más común en financiación de usados en Argentina ("X cuotas fijas de $Y").
  if(!monto || !cuotas || cuotas<=0) return {cuota:0, total:0, interes:0};
  const interes = monto * (tasaMensual||0) * cuotas;
  const total = monto + interes;
  const cuota = total/cuotas;
  return {cuota, total, interes};
}

/* ======================================================================
   IPC — inflación (replica el bloque de Config y las columnas de ajuste
   por IPC de Gastos e Inventario)
====================================================================== */
const MESES_ABBR = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function mesLabel(mesStr){
  const [y,m] = mesStr.split("-").map(Number);
  return MESES_ABBR[m-1]+"-"+String(y).slice(2);
}
function ipcIndices(){
  let acc = 100;
  return DATA.config.ipcSerie.map((row,i)=>{
    if(i>0) acc = acc*(1+row.variacion);
    return {...row, indice:acc};
  });
}
function mesDeHoy(){
  const h = todayDate();
  return h.getFullYear()+"-"+String(h.getMonth()+1).padStart(2,"0");
}
function indiceHoy(){
  const series = ipcIndices();
  const found = series.find(r=>r.mes===mesDeHoy());
  return found ? found.indice : series[series.length-1].indice;
}
function ipcIndiceEnMes(fechaStr){
  const series = ipcIndices();
  const found = series.find(r=>r.mes===fechaStr.slice(0,7));
  return found ? found.indice : indiceHoy();
}
function importeGastoHoy(g){
  return g.importe * indiceHoy() / ipcIndiceEnMes(g.fecha);
}

/* ======================================================================
   MOTOR DE CÁLCULO  (replica las fórmulas de la hoja "Inventario")
====================================================================== */
function computeInventory(){
  const cfg = DATA.config;
  const hoy = todayDate();
  return DATA.vehiculos.map(v=>{
    const venta = DATA.ventas.find(x=>x.idVehiculo===v.id) || null;
    const estado = venta ? "Vendido" : v.estado;
    const gastosVehiculo = DATA.gastos.filter(g=>g.idVehiculo===v.id);
    const gastosAcum = gastosVehiculo.reduce((s,g)=>s+g.importe,0) + (venta? venta.gastosFinales : 0);
    const costoTotal = v.precioCompra + gastosAcum;
    const fechaFin = venta ? d(venta.fechaVenta) : hoy;
    const diasEnStock = daysBetween(d(v.fechaIngreso), fechaFin);

    const historial = DATA.precios.filter(p=>p.idVehiculo===v.id).sort((a,b)=>d(a.fecha)-d(b.fecha));
    const precioActual = historial.length ? historial[historial.length-1].nuevoPrecio : v.precioObjetivo;

    const capitalInmovilizado = estado==="Vendido" ? 0 : costoTotal;
    const gananciaEstimada = precioActual - costoTotal;
    const margenEsperado = v.precioObjetivo ? (v.precioObjetivo - costoTotal)/v.precioObjetivo : 0;
    const margenActual = precioActual ? (precioActual - costoTotal)/precioActual : 0;
    const margenReal = venta ? (venta.precioFinal - costoTotal)/venta.precioFinal : null;

    const precioParaMargenObjetivo = costoTotal/(1-cfg.margenObjetivo);
    const ajusteNecesario = precioActual ? (precioParaMargenObjetivo/precioActual - 1) : 0;
    const varVsObjetivo = v.precioObjetivo ? (precioActual/v.precioObjetivo - 1) : null;
    const gastosRatio = v.precioCompra ? gastosAcum/v.precioCompra : 0;
    const costoDiario = diasEnStock>0 ? costoTotal/diasEnStock : costoTotal;
    const cantidadGastos = gastosVehiculo.length;
    const precioParaMargenMinimo = costoTotal/(1-cfg.margenMinimo);
    const precioEquilibrio = costoTotal;

    // Ajuste por inflación (IPC INDEC) — replica Inventario!Z:AD
    const idxHoy = indiceHoy();
    const indiceCompra = ipcIndiceEnMes(v.fechaIngreso);
    const costoTotalHoy = v.precioCompra*idxHoy/indiceCompra + gastosVehiculo.reduce((s,g)=>s+importeGastoHoy(g),0) + (venta? venta.gastosFinales : 0);
    const margenRealIPC = precioActual ? (precioActual - costoTotalHoy)/precioActual : null;
    const gananciaRealIPC = precioActual - costoTotalHoy;
    const gananciaRealIPCUSD = gananciaRealIPC/cfg.tipoCambio;

    let alerta;
    if(estado==="Vendido") alerta="vendido";
    else if(diasEnStock>=cfg.diasRojo) alerta="critico";
    else if(diasEnStock>=cfg.diasAmarillo) alerta="atencion";
    else if(diasEnStock>=cfg.diasVerde) alerta="observar";
    else alerta="normal";

    const diagParts = [];
    if(estado==="Vendido"){
      diagParts.push("✅ Vendido en "+diasEnStock+" días con margen real de "+fmtPct(margenReal)+".");
    }else{
      if(diasEnStock>=cfg.diasRojo) diagParts.push("🔴 Lleva "+diasEnStock+" días en stock.");
      else if(diasEnStock>=cfg.diasAmarillo) diagParts.push("⚠️ Lleva "+diasEnStock+" días en stock.");
      else if(diasEnStock>=cfg.diasVerde) diagParts.push("🟡 Lleva "+diasEnStock+" días en stock, dentro de lo esperable.");
      else diagParts.push("🟢 Lleva "+diasEnStock+" días en stock, plazo normal.");
      if(margenActual < cfg.margenMinimo) diagParts.push("⚠️ Margen actual "+fmtPct(margenActual)+", por debajo del mínimo.");
      if(margenActual < margenEsperado - cfg.toleranciaCaidaMargen) diagParts.push("📉 El margen cayó de "+fmtPct(margenEsperado)+" a "+fmtPct(margenActual)+".");
      if(gastosAcum >= cfg.umbralGastosAltos) diagParts.push("💰 "+fmtARS(gastosAcum)+" de gastos acumulados.");
      if(margenActual >= cfg.margenObjetivo) diagParts.push("📈 Margen por encima del objetivo.");
      if(ajusteNecesario > cfg.toleranciaDesvioPrecio) diagParts.push("🎯 Para el margen objetivo habría que publicarlo a "+fmtARS(precioParaMargenObjetivo)+".");
    }

    return {
      ...v, estado, venta, gastosAcum, costoTotal, diasEnStock, precioActual,
      capitalInmovilizado, gananciaEstimada, margenEsperado, margenActual, margenReal,
      precioParaMargenObjetivo, ajusteNecesario, alerta, diagnostico: diagParts.join(" "),
      historial, varVsObjetivo, gastosRatio, costoDiario, cantidadGastos,
      precioParaMargenMinimo, precioEquilibrio, gastosVehiculo,
      indiceCompra, costoTotalHoy, margenRealIPC, gananciaRealIPC, gananciaRealIPCUSD,
    };
  });
}

function integrityChecks(){
  const dupCount = (arr, key) => arr.length - new Set(arr.map(x=>x[key])).size;
  const vehIds = new Set(DATA.vehiculos.map(v=>v.id));
  const ventaCounts = {};
  DATA.ventas.forEach(x=>{ ventaCounts[x.idVehiculo] = (ventaCounts[x.idVehiculo]||0)+1; });
  const vendidosDuplicados = Object.values(ventaCounts).filter(n=>n>1).length;
  return [
    {label:"IDs duplicados en Vehículos", n:dupCount(DATA.vehiculos,"id")},
    {label:"IDs duplicados en Gastos", n:dupCount(DATA.gastos,"id")},
    {label:"IDs duplicados en Precios", n:dupCount(DATA.precios,"id")},
    {label:"IDs duplicados en Ventas", n:dupCount(DATA.ventas,"id")},
    {label:"Vehículos vendidos más de una vez", n:vendidosDuplicados},
    {label:"Gastos con ID de vehículo inexistente", n:DATA.gastos.filter(g=>!vehIds.has(g.idVehiculo)).length},
    {label:"Precios con ID de vehículo inexistente", n:DATA.precios.filter(p=>!vehIds.has(p.idVehiculo)).length},
    {label:"Ventas con ID de vehículo inexistente", n:DATA.ventas.filter(x=>!vehIds.has(x.idVehiculo)).length},
  ];
}

/* ======================================================================
   EVOLUCIÓN MENSUAL — reconstruye capital inmovilizado y ganancia
   nominal/real acumulada mes a mes, usando las fechas ya cargadas.
====================================================================== */
function evolucionMensual(){
  const inv = computeInventory();
  return DATA.config.ipcSerie.map(row=>{
    const [y,m] = row.mes.split("-").map(Number);
    const asOf = new Date(y, m, 0); // último día de ese mes
    let capital = 0;
    DATA.vehiculos.forEach(v=>{
      if(d(v.fechaIngreso) > asOf) return;
      const venta = DATA.ventas.find(x=>x.idVehiculo===v.id);
      if(venta && d(venta.fechaVenta) <= asOf) return;
      const gastosAsOf = DATA.gastos.filter(g=>g.idVehiculo===v.id && d(g.fecha)<=asOf).reduce((s,g)=>s+g.importe,0);
      capital += v.precioCompra + gastosAsOf;
    });
    let gananciaNomAcum = 0, gananciaRealAcum = 0;
    inv.forEach(v=>{
      if(v.venta && d(v.venta.fechaVenta) <= asOf){
        gananciaNomAcum += (v.venta.precioFinal - v.costoTotal);
        gananciaRealAcum += (v.venta.precioFinal - v.costoTotalHoy);
      }
    });
    return {mes:row.mes, asOf, capital, gananciaNomAcum, gananciaRealAcum};
  });
}

function pillFor(alerta){

  const m = map[alerta] || map.normal;
  return `<span class="pill ${m.c}"><span class="dot"></span>${m.t}</span>`;
}

/* ======================================================================
   CHARTS (SVG) — barras horizontales con tooltip
====================================================================== */
function hBarChart(el, items, opts){
  opts = opts||{};
  const w = el.clientWidth || 560;
  const rowH = opts.rowH || 30;
  const gap = 10;
  const labelW = opts.labelW || 128;
  const valueW = 96;
  const plotW = Math.max(80, w - labelW - valueW - 16);
  const h = items.length*rowH + (items.length-1)*gap + 8;
  const max = Math.max(1, ...items.map(i=>i.value));

  let bars = "";
  items.forEach((it,i)=>{
    const y = i*(rowH+gap);
    const bw = Math.max(2, (it.value/max)*plotW);
    bars += `
      <g class="hbar" data-idx="${i}">
        <text x="${labelW-10}" y="${y+rowH/2}" text-anchor="end" dominant-baseline="middle" class="barlbl">${esc(it.label)}</text>
        <rect x="${labelW}" y="${y+6}" width="${plotW}" height="${rowH-12}" rx="4" fill="var(--surface-sunken)"></rect>
        <rect x="${labelW}" y="${y+6}" width="${bw}" height="${rowH-12}" rx="4" fill="${it.color}" data-full="${bw}"></rect>
        <text x="${labelW+plotW+10}" y="${y+rowH/2}" dominant-baseline="middle" class="barval">${it.valueLabel}</text>
      </g>`;
  });

  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="${esc(opts.ariaLabel||'')}">${bars}</svg>`;

  const tip = document.getElementById("tooltip");
  el.querySelectorAll(".hbar").forEach((g,i)=>{
    g.addEventListener("mouseenter",(ev)=>{
      const it = items[i];
      tip.style.display="block";
      tip.innerHTML = `<strong>${esc(it.label)}</strong><br>${it.tooltip||it.valueLabel}`;
      moveTip(ev);
    });
    g.addEventListener("mousemove", moveTip);
    g.addEventListener("mouseleave", ()=>{ tip.style.display="none"; });
  });
  function moveTip(ev){
    const tip = document.getElementById("tooltip");
    tip.style.left = ev.clientX+"px";
    tip.style.top = ev.clientY+"px";
  }
}

function lineChart(el, points, opts){
  opts = opts||{};
  const w = el.clientWidth || 480;
  const h = opts.h || 160;
  const padL=44, padR=16, padT=16, padB=26;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  if(points.length===0){
    el.innerHTML = `<div class="empty">Sin cambios de precio registrados</div>`;
    return;
  }
  const xs = points.map(p=>p.x.getTime());
  const ys = points.map(p=>p.y);
  const xmin=Math.min(...xs), xmax=Math.max(...xs);
  const ymin=Math.min(...ys)*0.97, ymax=Math.max(...ys)*1.03;
  const X = t => padL + (xmax===xmin?plotW/2:(t-xmin)/(xmax-xmin)*plotW);
  const Y = v => padT + plotH - (ymax===ymin?plotH/2:(v-ymin)/(ymax-ymin)*plotH);

  let grid="";
  for(let i=0;i<=3;i++){
    const gy = padT + plotH*i/3;
    grid += `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" class="gridline" stroke-width="1"/>`;
  }

  const path = points.map((p,i)=> (i===0?"M":"L")+X(p.x.getTime()).toFixed(1)+","+Y(p.y).toFixed(1)).join(" ");
  const area = path + ` L${X(points[points.length-1].x.getTime()).toFixed(1)},${(padT+plotH).toFixed(1)} L${X(points[0].x.getTime()).toFixed(1)},${(padT+plotH).toFixed(1)} Z`;

  let dots = "";
  points.forEach((p,i)=>{
    dots += `<circle class="pt" data-idx="${i}" cx="${X(p.x.getTime()).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface-card)" stroke-width="2"></circle>`;
  });
  const lastX = X(points[points.length-1].x.getTime()), lastY = Y(points[points.length-1].y);

  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    ${grid}
    <path d="${area}" fill="var(--accent)" opacity="0.08"></path>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    ${dots}
    <circle cx="${lastX}" cy="${lastY}" r="5.5" fill="none" stroke="var(--accent)" stroke-width="2"></circle>
    <text x="${padL}" y="${h-6}" class="barlbl">${points[0].x.toLocaleDateString("es-AR")}</text>
    <text x="${w-padR}" y="${h-6}" text-anchor="end" class="barlbl">${points[points.length-1].x.toLocaleDateString("es-AR")}</text>
  </svg>`;

  const tip = document.getElementById("tooltip");
  el.querySelectorAll(".pt").forEach((c,i)=>{
    c.addEventListener("mouseenter",(ev)=>{
      const p = points[i];
      tip.style.display="block";
      tip.innerHTML = `<strong>${fmtARS(p.y)}</strong><br>${p.x.toLocaleDateString("es-AR")}${p.label?" — "+esc(p.label):""}`;
      tip.style.left=ev.clientX+"px"; tip.style.top=ev.clientY+"px";
    });
    c.addEventListener("mousemove",(ev)=>{ tip.style.left=ev.clientX+"px"; tip.style.top=ev.clientY+"px"; });
    c.addEventListener("mouseleave",()=>{ tip.style.display="none"; });
  });
}

function multiLineChart(el, series, opts){
  opts = opts||{};
  const w = el.clientWidth || 480;
  const h = opts.h || 200;
  const padL=54, padR=16, padT=16, padB=26;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const allPoints = series.flatMap(s=>s.points);
  if(!allPoints.length){ el.innerHTML = `<div class="empty">Sin datos suficientes todavía</div>`; return; }
  const xs = allPoints.map(p=>p.x.getTime()), ys = allPoints.map(p=>p.y);
  const xmin=Math.min(...xs), xmax=Math.max(...xs);
  let ymin=Math.min(0,...ys), ymax=Math.max(0,...ys);
  if(ymin===ymax){ ymin-=1; ymax+=1; }
  const pad=(ymax-ymin)*0.1; ymin-=pad; ymax+=pad;
  const X = t => padL + (xmax===xmin?plotW/2:(t-xmin)/(xmax-xmin)*plotW);
  const Y = v => padT + plotH - (ymax===ymin?plotH/2:(v-ymin)/(ymax-ymin)*plotH);

  let grid="";
  for(let i=0;i<=3;i++){
    const gy = padT + plotH*i/3;
    grid += `<line x1="${padL}" y1="${gy}" x2="${w-padR}" y2="${gy}" class="gridline" stroke-width="1"/>`;
  }
  let zeroLine = "";
  if(ymin<0 && ymax>0){
    const zy = Y(0).toFixed(1);
    zeroLine = `<line x1="${padL}" y1="${zy}" x2="${w-padR}" y2="${zy}" stroke="var(--border-strong)" stroke-width="1" stroke-dasharray="3,3"/>`;
  }
  let paths = "";
  series.forEach(s=>{
    const pts = s.points.slice().sort((a,b)=>a.x-b.x);
    const path = pts.map((p,i)=>(i===0?"M":"L")+X(p.x.getTime()).toFixed(1)+","+Y(p.y).toFixed(1)).join(" ");
    paths += `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    pts.forEach(p=>{
      paths += `<circle cx="${X(p.x.getTime()).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="${s.color}"><title>${esc(s.label)} — ${p.x.toLocaleDateString("es-AR",{month:"short",year:"2-digit"})}: ${s.fmt?esc(s.fmt(p.y)):p.y}</title></circle>`;
    });
  });
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    ${grid}${zeroLine}${paths}
    <text x="${padL}" y="${h-6}" class="barlbl">${new Date(xmin).toLocaleDateString("es-AR",{month:"short",year:"2-digit"})}</text>
    <text x="${w-padR}" y="${h-6}" text-anchor="end" class="barlbl">${new Date(xmax).toLocaleDateString("es-AR",{month:"short",year:"2-digit"})}</text>
  </svg>
  <div class="chart-legend">${series.map(s=>`<div class="legend-item"><span class="legend-swatch" style="background:${s.color};"></span>${esc(s.label)}</div>`).join("")}</div>`;
}

/* ======================================================================
   RENDER: DASHBOARD
====================================================================== */
function renderDashboard(){
  const inv = computeInventory();
  const cfg = DATA.config;
  const activos = inv.filter(v=>v.estado!=="Vendido");
  const vendidos = inv.filter(v=>v.estado==="Vendido");

  const capitalTotal = activos.reduce((s,v)=>s+v.capitalInmovilizado,0);
  const capitalAnejo = activos.filter(v=>v.diasEnStock>=cfg.diasAmarillo).reduce((s,v)=>s+v.capitalInmovilizado,0);
  const nAnejo = activos.filter(v=>v.diasEnStock>=cfg.diasAmarillo).length;
  const diasProm = activos.length ? activos.reduce((s,v)=>s+v.diasEnStock,0)/activos.length : 0;
  const gastosTotalStock = activos.reduce((s,v)=>s+v.gastosAcum,0);
  const ticketProm = activos.length ? activos.reduce((s,v)=>s+v.precioActual,0)/activos.length : 0;
  const masCaro = activos.length ? Math.max(...activos.map(v=>v.precioActual)) : 0;
  const masBarato = activos.length ? Math.min(...activos.map(v=>v.precioActual)) : 0;
  const facturacionActual = activos.reduce((s,v)=>s+v.precioActual,0);
  const gananciaActual = activos.reduce((s,v)=>s+v.gananciaEstimada,0);
  const margenPonderado = facturacionActual ? gananciaActual/facturacionActual : 0;
  const facturacionObjetivo = activos.reduce((s,v)=>s+v.precioParaMargenObjetivo,0);
  const gananciaObjetivo = facturacionObjetivo - capitalTotal;
  const margenRealVendidos = vendidos.length ? (vendidos.reduce((s,v)=>s+v.venta.precioFinal,0) - vendidos.reduce((s,v)=>s+v.costoTotal,0)) / vendidos.reduce((s,v)=>s+v.venta.precioFinal,0) : 0;

  // Ganancia real ajustada por inflación (IPC) — stock activo
  const gananciaEstimadaUSD = cfg.tipoCambio ? gananciaActual/cfg.tipoCambio : 0;
  const gananciaRealTotalUSD = activos.reduce((s,v)=>s+v.gananciaRealIPCUSD,0);
  const autosConPerdidaReal = activos.filter(v=>v.margenRealIPC!==null && v.margenRealIPC<0).length;
  const margenRealPonderado = facturacionActual ? activos.reduce((s,v)=>s+v.gananciaRealIPC,0)/facturacionActual : 0;
  const inflacionPromedio = inv.length ? indiceHoy()/(inv.reduce((s,v)=>s+v.indiceCompra,0)/inv.length) - 1 : 0;
  const ratioNominalReal = gananciaEstimadaUSD ? gananciaRealTotalUSD/gananciaEstimadaUSD : 0;
  const deltaNominalReal = ratioNominalReal - 1;

  const buckets = [
    {label:"0–"+cfg.diasVerde+" días", min:0, max:cfg.diasVerde, color:"var(--good)"},
    {label:(cfg.diasVerde+1)+"–"+cfg.diasAmarillo+" días", min:cfg.diasVerde+1, max:cfg.diasAmarillo, color:"var(--warning)"},
    {label:(cfg.diasAmarillo+1)+"–"+cfg.diasRojo+" días", min:cfg.diasAmarillo+1, max:cfg.diasRojo, color:"var(--serious)"},
    {label:"Más de "+cfg.diasRojo+" días", min:cfg.diasRojo+1, max:Infinity, color:"var(--critical)"},
  ].map(b=>{
    const val = activos.filter(v=>v.diasEnStock>=b.min && v.diasEnStock<=b.max).reduce((s,v)=>s+v.capitalInmovilizado,0);
    const n = activos.filter(v=>v.diasEnStock>=b.min && v.diasEnStock<=b.max).length;
    return {label:b.label, value:val, valueLabel: (val/1e6).toLocaleString("es-AR",{maximumFractionDigits:1})+"M", tooltip: fmtARS(val)+" · "+n+" vehículo(s)", color:b.color};
  });

  const gastosPorCat = CATEGORIAS.map(cat=>{
    const val = DATA.gastos.filter(g=>g.categoria===cat).reduce((s,g)=>s+g.importe,0);
    const n = DATA.gastos.filter(g=>g.categoria===cat).length;
    return {label:cat, value:val, n, valueLabel: val? (val/1e6).toLocaleString("es-AR",{maximumFractionDigits:2})+"M":"—", tooltip: fmtARS(val)+" · "+n+" gasto(s)"};
  }).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).map(x=>({...x, color:"var(--accent)"}));

  const criticos = activos.filter(v=>v.alerta==="critico").sort((a,b)=>b.diasEnStock-a.diasEnStock);
  const margenBajo = activos.filter(v=>v.margenActual < cfg.margenMinimo).sort((a,b)=>a.margenActual-b.margenActual);

  const masAntiguo = activos.length? activos.reduce((a,b)=> b.diasEnStock>a.diasEnStock?b:a) : null;
  const mayorGastoV = activos.length? activos.reduce((a,b)=> b.gastosAcum>a.gastosAcum?b:a) : null;
  const mejorMargenV = activos.length? activos.reduce((a,b)=> b.margenActual>a.margenActual?b:a) : null;
  const necesitanAjuste = activos.filter(v=>v.ajusteNecesario>cfg.toleranciaDesvioPrecio);
  const faltanteTotal = necesitanAjuste.reduce((s,v)=>s+(v.precioParaMargenObjetivo-v.precioActual),0);
  const nombreV = v => `${v.marca} ${v.modelo} ${v.anio}`;

  const topAntiguedad = activos.slice().sort((a,b)=>b.diasEnStock-a.diasEnStock).slice(0,5);
  const topCapitalRank = activos.slice().sort((a,b)=>b.capitalInmovilizado-a.capitalInmovilizado).slice(0,5);
  const topMenorMargen = activos.slice().sort((a,b)=>a.margenActual-b.margenActual).slice(0,5);
  const topGastoRank = activos.slice().sort((a,b)=>b.gastosAcum-a.gastosAcum).slice(0,5);

  const rankList = (items, valueFn) => items.length? items.map((v,i)=>`
      <div style="display:flex; justify-content:space-between; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--border); gap:10px;">
        <div style="display:flex; gap:8px; min-width:0;"><span style="color:var(--ink-3); font-family:'IBM Plex Mono',monospace; font-size:11.5px; flex:none;">${i+1}</span><span style="font-size:12.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(nombreV(v))}</span></div>
        <span class="mono" style="font-size:12px; flex:none; color:var(--ink-2);">${valueFn(v)}</span>
      </div>`).join("") : `<div class="empty" style="padding:14px 0;">Sin datos</div>`;

  const integrity = integrityChecks();
  const integrityOk = integrity.every(c=>c.n===0);

  return `
    <div class="grid grid-stats">
      <div class="card stat">
        <div class="stat-label">CAPITAL TOTAL INMOVILIZADO</div>
        <div class="stat-value">${fmtARS(capitalTotal)}</div>
        <div class="stat-caption">${fmtUSD(capitalTotal/cfg.tipoCambio)} · compra + gastos de ${activos.length} unidad(es)</div>
      </div>
      <div class="card stat">
        <div class="stat-label">VEHÍCULOS EN STOCK</div>
        <div class="stat-value">${activos.length}</div>
        <div class="stat-caption">${vendidos.length} vendido(s) histórico(s)</div>
      </div>
      <div class="card stat">
        <div class="stat-label">DÍAS PROMEDIO EN STOCK</div>
        <div class="stat-value">${diasProm.toFixed(0)}</div>
        <div class="stat-caption">Plazo normal configurado: ${cfg.diasVerde} días</div>
      </div>
      <div class="card stat">
        <div class="stat-label">MARGEN ACTUAL PONDERADO</div>
        <div class="stat-value">${fmtPct(margenPonderado)}</div>
        <div class="stat-caption">Objetivo configurado: ${fmtPct(cfg.margenObjetivo,0)}</div>
      </div>

      <div class="card stat">
        <div class="stat-label">CAPITAL EN UNIDADES AÑEJAS</div>
        <div class="stat-value critical">${fmtARS(capitalAnejo)}</div>
        <div class="stat-caption critical">${fmtUSD(capitalAnejo/cfg.tipoCambio)} · ${nAnejo} unidad(es) con más de ${cfg.diasAmarillo} días</div>
      </div>
      <div class="card stat">
        <div class="stat-label">TOTAL GASTOS DEL STOCK</div>
        <div class="stat-value">${fmtARS(gastosTotalStock)}</div>
        <div class="stat-caption">${fmtUSD(gastosTotalStock/cfg.tipoCambio)} · promedio ${fmtARS(activos.length?gastosTotalStock/activos.length:0)} por unidad</div>
      </div>
      <div class="card stat">
        <div class="stat-label">TICKET PROMEDIO DEL STOCK</div>
        <div class="stat-value">${fmtARS(ticketProm)}</div>
        <div class="stat-caption">Más caro ${fmtARS(masCaro)} · más barato ${fmtARS(masBarato)}</div>
      </div>
      <div class="card stat">
        <div class="stat-label">MARGEN REAL DE VENDIDOS</div>
        <div class="stat-value good">${fmtPct(margenRealVendidos)}</div>
        <div class="stat-caption">${vendidos.length} operación(es) cerrada(s)</div>
      </div>
    </div>

    <div class="grid grid-stats" style="margin-top:14px;">
      <div class="card stat">
        <div class="stat-label">FACTURACIÓN ESTIMADA (precio actual)</div>
        <div class="stat-value small">${fmtARS(facturacionActual)}</div>
        <div class="stat-caption">${fmtUSD(facturacionActual/cfg.tipoCambio)} · margen ${fmtPct(margenPonderado)}</div>
      </div>
      <div class="card stat">
        <div class="stat-label">GANANCIA ESTIMADA</div>
        <div class="stat-value small good">${fmtARS(gananciaActual)}</div>
        <div class="stat-caption good">${fmtUSD(gananciaActual/cfg.tipoCambio)} · al precio publicado hoy</div>
      </div>
      <div class="card stat">
        <div class="stat-label">FACTURACIÓN CON MARGEN OBJETIVO</div>
        <div class="stat-value small accent">${fmtARS(facturacionObjetivo)}</div>
        <div class="stat-caption accent">${fmtUSD(facturacionObjetivo/cfg.tipoCambio)}</div>
      </div>
      <div class="card stat">
        <div class="stat-label">GANANCIA CON MARGEN OBJETIVO</div>
        <div class="stat-value small accent">${fmtARS(gananciaObjetivo)}</div>
        <div class="stat-caption accent">${fmtUSD(gananciaObjetivo/cfg.tipoCambio)} · upside de ${fmtARS(gananciaObjetivo-gananciaActual)} vs. hoy</div>
      </div>
    </div>

    <div class="grid grid-stats" style="margin-top:14px;">
      <div class="card stat">
        <div class="stat-label">GANANCIA REAL EN USD (ajustada por inflación)</div>
        <div class="stat-value small ${gananciaRealTotalUSD<0?'critical':'good'}">${fmtUSD(gananciaRealTotalUSD)}</div>
        <div class="stat-caption ${gananciaRealTotalUSD<0?'critical':''}">Al precio de hoy. Margen real ponderado ${fmtPct(margenRealPonderado)}</div>
      </div>
      <div class="card stat">
        <div class="stat-label">AUTOS CON PÉRDIDA REAL</div>
        <div class="stat-value small ${autosConPerdidaReal>0?'critical':'good'}">${autosConPerdidaReal}</div>
        <div class="stat-caption">Margen nominal positivo pero real negativo tras un ${fmtPct(inflacionPromedio)} de inflación promedio</div>
      </div>
      <div class="card stat">
        <div class="stat-label">GANANCIA NOMINAL vs REAL</div>
        <div class="stat-value small ${deltaNominalReal<0?'critical':''}">${fmtPct(ratioNominalReal,0)}</div>
        <div class="stat-caption ${deltaNominalReal<0?'critical':''}">La ganancia real es ${deltaNominalReal>=0?"+":""}${fmtPct(deltaNominalReal,0)} respecto de la nominal</div>
      </div>
      <div class="card stat">
        <div class="stat-label">ÍNDICE IPC USADO</div>
        <div class="stat-value small">${indiceHoy().toLocaleString("es-AR",{maximumFractionDigits:2})}</div>
        <div class="stat-caption">Base jul-25=100. Fuente: INDEC.</div>
      </div>
    </div>

    <div class="section-title" style="margin:22px 0 2px;">Evolución mensual</div>
    <div class="section-note">Reconstruida a partir de las fechas ya cargadas — muestra cómo la inflación se va comiendo la ganancia real mes a mes.</div>
    <div class="grid grid-2">
      <div class="card" style="padding:18px 20px;">
        <div class="section-title">Capital inmovilizado — evolución mensual</div>
        <div class="section-note">Plata inmovilizada en stock activo, a fin de cada mes (pesos nominales de ese momento)</div>
        <div id="chartEvolCapital"></div>
      </div>
      <div class="card" style="padding:18px 20px;">
        <div class="section-title">Ganancia acumulada: nominal vs. real (USD)</div>
        <div class="section-note">Ventas cerradas hasta cada mes — la línea real ya descuenta la inflación</div>
        <div id="chartEvolGanancia"></div>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:14px;">
      <div class="card" style="padding:18px 20px;">
        <div class="section-title">Capital inmovilizado por antigüedad</div>
        <div class="section-note">Cuánto capital está parado en cada franja de días en stock</div>
        <div id="chartBuckets"></div>
      </div>
      <div class="card" style="padding:18px 20px;">
        <div class="section-title">Gastos acumulados por categoría</div>
        <div class="section-note">Suma histórica de gastos cargados, todas las unidades</div>
        <div id="chartGastos"></div>
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:14px;">
      <div class="card" style="padding:18px 20px;">
        <div class="section-title">🔴 Vehículos críticos (${cfg.diasRojo}+ días)</div>
        <div class="section-note">Ordenados por días en stock</div>
        ${criticos.length? criticos.map(v=>`
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);">
            <div>
              <div style="font-weight:600; font-size:13px;">${esc(v.marca)} ${esc(v.modelo)} ${v.anio}</div>
              <div style="font-size:11.5px; color:var(--ink-3);">${v.diasEnStock} días · margen actual ${fmtPct(v.margenActual)}</div>
            </div>
            <button class="btn btn-sm btn-ghost" data-goficha="${v.id}">Ver ficha →</button>
          </div>`).join("") : `<div class="empty">No hay vehículos en estado crítico.</div>`}
      </div>
      <div class="card" style="padding:18px 20px;">
        <div class="section-title">⚠️ Margen por debajo del mínimo</div>
        <div class="section-note">Mínimo configurado: ${fmtPct(cfg.margenMinimo,0)} sobre precio de venta</div>
        ${margenBajo.length? margenBajo.map(v=>`
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border);">
            <div>
              <div style="font-weight:600; font-size:13px;">${esc(v.marca)} ${esc(v.modelo)} ${v.anio}</div>
              <div style="font-size:11.5px; color:var(--ink-3);">margen ${fmtPct(v.margenActual)} · esperado ${fmtPct(v.margenEsperado)}</div>
            </div>
            <button class="btn btn-sm btn-ghost" data-goficha="${v.id}">Ver ficha →</button>
          </div>`).join("") : `<div class="empty">Ningún vehículo por debajo del margen mínimo.</div>`}
      </div>
    </div>

    <div class="card" style="padding:18px 20px; margin-top:14px;">
      <div class="section-title">Alertas e indicadores automáticos</div>
      <div class="section-note">Se recalculan solos con cada cambio de datos o de configuración</div>
      <div style="display:flex; flex-direction:column; gap:9px; font-size:12.5px; line-height:1.6;">
        <div>⚠️ Tenés <strong>${fmtARS(capitalAnejo)}</strong> inmovilizados en ${nAnejo} vehículo(s) con más de ${cfg.diasAmarillo} días en stock.</div>
        ${criticos.length? `<div>🔴 ${criticos.length} vehículo(s) superan los ${cfg.diasRojo} días: ${criticos.map(v=>esc(nombreV(v))).join(", ")}.</div>` : ""}
        ${margenBajo.length? `<div>⚠️ ${margenBajo.length} vehículo(s) con margen actual por debajo del mínimo (${fmtPct(cfg.margenMinimo,0)}): ${margenBajo.map(v=>esc(nombreV(v))).join(", ")}.</div>` : ""}
        ${masAntiguo? `<div>🕒 Unidad más antigua: <strong>${esc(nombreV(masAntiguo))}</strong> — ${masAntiguo.diasEnStock} días y ${fmtARS(masAntiguo.capitalInmovilizado)} inmovilizados.</div>` : ""}
        ${mayorGastoV? `<div>💰 Mayor gasto acumulado: <strong>${esc(nombreV(mayorGastoV))}</strong> con ${fmtARS(mayorGastoV.gastosAcum)} en gastos sobre el precio de compra.</div>` : ""}
        ${mejorMargenV? `<div>📈 Mejor margen actual: <strong>${esc(nombreV(mejorMargenV))}</strong> con ${fmtPct(mejorMargenV.margenActual)}, contra un promedio ponderado de ${fmtPct(margenPonderado)}.</div>` : ""}
        ${necesitanAjuste.length? `<div>🎯 ${necesitanAjuste.length} vehículo(s) están más de ${fmtPct(cfg.toleranciaDesvioPrecio,0)} por debajo del precio necesario para el margen objetivo de ${fmtPct(cfg.margenObjetivo,0)}: faltan ${fmtARS(faltanteTotal)} en total.</div>` : `<div>✅ Ningún vehículo necesita ajuste de precio para llegar al margen objetivo.</div>`}
        <div>${integrityOk? "✅ Sin IDs duplicados y sin gastos, precios o ventas apuntando a un vehículo que no existe." : "⚠️ Hay inconsistencias de datos — revisá el panel de Controles de integridad más abajo."}</div>
      </div>
    </div>

    <div class="section-title" style="margin:22px 0 2px;">Rankings del stock — Top 5</div>
    <div class="section-note">Solo unidades en stock (no vendidas)</div>
    <div class="grid grid-stats">
      <div class="card" style="padding:16px 18px;">
        <h3 style="font-size:11px; margin:0 0 8px; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase;">Mayor antigüedad</h3>
        ${rankList(topAntiguedad, v=>v.diasEnStock+" d")}
      </div>
      <div class="card" style="padding:16px 18px;">
        <h3 style="font-size:11px; margin:0 0 8px; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase;">Mayor capital inmovilizado</h3>
        ${rankList(topCapitalRank, v=>(v.capitalInmovilizado/1e6).toLocaleString("es-AR",{maximumFractionDigits:1})+"M")}
      </div>
      <div class="card" style="padding:16px 18px;">
        <h3 style="font-size:11px; margin:0 0 8px; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase;">Menor margen actual</h3>
        ${rankList(topMenorMargen, v=>fmtPct(v.margenActual))}
      </div>
      <div class="card" style="padding:16px 18px;">
        <h3 style="font-size:11px; margin:0 0 8px; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase;">Mayor gasto acumulado</h3>
        ${rankList(topGastoRank, v=>(v.gastosAcum/1e6).toLocaleString("es-AR",{maximumFractionDigits:2})+"M")}
      </div>
    </div>

    <div class="grid grid-2" style="margin-top:14px;">
      <div class="card" style="padding:18px 20px;">
        <div class="section-title">Top vehículos por capital inmovilizado</div>
        <div class="section-note">Las unidades que más plata tienen paradas hoy</div>
        <div id="chartTopCapital"></div>
      </div>
      <div class="card" style="padding:18px 20px;">
        <div class="section-title">Controles de integridad</div>
        <div class="section-note">Chequeos automáticos de consistencia entre las cuatro tablas</div>
        <div style="display:flex; flex-direction:column;">
          ${integrity.map(c=>`
            <div style="display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--border); font-size:12.5px;">
              <span style="color:var(--ink-2);">${c.label}</span>
              <span class="pill ${c.n===0?'pill-normal':'pill-critico'}"><span class="dot"></span>${c.n}</span>
            </div>`).join("")}
        </div>
      </div>
    </div>
  `;
}

function afterRenderDashboard(){
  const inv = computeInventory();
  const cfg = DATA.config;
  const activos = inv.filter(v=>v.estado!=="Vendido");

  const buckets = [
    {label:"0–"+cfg.diasVerde, min:0, max:cfg.diasVerde, color:"var(--good)"},
    {label:(cfg.diasVerde+1)+"–"+cfg.diasAmarillo, min:cfg.diasVerde+1, max:cfg.diasAmarillo, color:"var(--warning)"},
    {label:(cfg.diasAmarillo+1)+"–"+cfg.diasRojo, min:cfg.diasAmarillo+1, max:cfg.diasRojo, color:"var(--serious)"},
    {label:"+"+cfg.diasRojo, min:cfg.diasRojo+1, max:Infinity, color:"var(--critical)"},
  ].map(b=>{
    const vs = activos.filter(v=>v.diasEnStock>=b.min && v.diasEnStock<=b.max);
    const val = vs.reduce((s,v)=>s+v.capitalInmovilizado,0);
    return {label:b.label+" días", value:val, valueLabel: val? "$ "+(val/1e6).toLocaleString("es-AR",{maximumFractionDigits:1})+"M":"$ 0", tooltip: fmtARS(val)+" · "+vs.length+" vehículo(s)", color:b.color};
  });
  const elB = document.getElementById("chartBuckets");
  if(elB) hBarChart(elB, buckets, {ariaLabel:"Capital por antigüedad"});

  const evol = evolucionMensual();
  const elEvolCap = document.getElementById("chartEvolCapital");
  if(elEvolCap) lineChart(elEvolCap, evol.map(e=>({x:e.asOf, y:e.capital})), {h:180});
  const elEvolGan = document.getElementById("chartEvolGanancia");
  if(elEvolGan){
    multiLineChart(elEvolGan, [
      {label:"Ganancia nominal acumulada", color:"var(--ink-3)", fmt:fmtUSD, points: evol.map(e=>({x:e.asOf, y:e.gananciaNomAcum/cfg.tipoCambio}))},
      {label:"Ganancia real acumulada (IPC)", color:"var(--accent)", fmt:fmtUSD, points: evol.map(e=>({x:e.asOf, y:e.gananciaRealAcum/cfg.tipoCambio}))},
    ], {h:180});
  }

  const gastosPorCat = CATEGORIAS.map(cat=>{
    const rows = DATA.gastos.filter(g=>g.categoria===cat);
    const val = rows.reduce((s,g)=>s+g.importe,0);
    return {label:cat, value:val, n:rows.length};
  }).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,8)
    .map(x=>({label:x.label, value:x.value, valueLabel:"$ "+(x.value/1e6).toLocaleString("es-AR",{maximumFractionDigits:2})+"M", tooltip: fmtARS(x.value)+" · "+x.n+" gasto(s)", color:"var(--accent)"}));
  const elG = document.getElementById("chartGastos");
  if(elG) hBarChart(elG, gastosPorCat, {ariaLabel:"Gastos por categoría"});

  const topCapital = activos.slice().sort((a,b)=>b.capitalInmovilizado-a.capitalInmovilizado).slice(0,6)
    .map(v=>({label:v.marca+" "+v.modelo+" "+v.anio, value:v.capitalInmovilizado, valueLabel:"$ "+(v.capitalInmovilizado/1e6).toLocaleString("es-AR",{maximumFractionDigits:1})+"M", tooltip: fmtARS(v.capitalInmovilizado)+" · "+v.diasEnStock+" días", color:"var(--accent)"}));
  const elT = document.getElementById("chartTopCapital");
  if(elT) hBarChart(elT, topCapital, {ariaLabel:"Top vehículos por capital inmovilizado", labelW:150});

  document.querySelectorAll("[data-goficha]").forEach(b=>{
    b.addEventListener("click", ()=>{
      window._fichaSelect = b.getAttribute("data-goficha");
      goTo("ficha");
    });
  });
}

        <div><div style="font-weight:600;">${esc(v.marca)} ${esc(v.modelo)} ${v.anio}</div><div style="font-size:11px; color:var(--ink-3);">${esc(v.id)} · ${esc(v.version)}</div></div>
      </div></td>
      <td>${pillFor(v.alerta)}</td>
      <td class="num">${v.diasEnStock}</td>

      <td class="num">${fmtPct(v.margenActual)}</td>
      <td class="num" style="color:${v.margenRealIPC<0?'var(--critical)':'var(--ink)'};" title="Índice IPC en compra: ${v.indiceCompra.toLocaleString("es-AR",{maximumFractionDigits:2})} · Costo a pesos de hoy: ${fmtARS(v.costoTotalHoy)}">${v.margenRealIPC!==null?fmtPct(v.margenRealIPC):"—"}</td>
      <td class="num" style="color:${v.gananciaRealIPCUSD<0?'var(--critical)':'var(--ink)'};">${fmtUSD(v.gananciaRealIPCUSD)}</td>
      <td class="diag">${v.diagnostico}</td>
    </tr>`;
}
function ordenInventario(inv){
  const order = {critico:0, atencion:1, observar:2, normal:3, vendido:4};
  return inv.slice().sort((a,b)=>order[a.alerta]-order[b.alerta] || b.diasEnStock-a.diasEnStock);
}
function renderInventario(){
  const inv = ordenInventario(computeInventory());
  const activos = inv.filter(v=>v.estado!=="Vendido").length;
  const marcas = [...new Set(DATA.vehiculos.map(v=>v.marca))].sort();

  return `

        <option value="">Todas las marcas</option>
        ${marcas.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join("")}
      </select>
      <select id="invDias" style="padding:8px 10px; border-radius:7px; border:1px solid var(--border-strong); background:var(--surface-sunken); color:var(--ink); font-size:13px;">
        <option value="">Cualquier antigüedad</option>
        <option value="0-30">0–30 días</option>
        <option value="31-60">31–60 días</option>
        <option value="61-90">61–90 días</option>
        <option value="91-+">Más de 90 días</option>

      <span class="form-msg" id="invContador" style="color:var(--ink-3); font-weight:500;"></span>

          <th>Vehículo</th><th>Estado</th><th class="num">Días</th><th class="num">Costo total</th>
          <th class="num">Precio actual</th><th class="num">Ganancia estimada</th><th class="num">Margen actual</th>
          <th class="num">Margen real (IPC)</th><th class="num">Ganancia real (USD)</th><th>Diagnóstico</th>
        </tr></thead>
        <tbody id="tbodyInventario">${inv.map(filaInventario).join("")}</tbody>
      </table>
    </div>
  `;
}
function afterRenderInventario(){
  const inv = ordenInventario(computeInventory());
  const tabla = document.getElementById("tablaInventario");
  const tbody = document.getElementById("tbodyInventario");
  const contador = document.getElementById("invContador");
  function aplicarFiltros(){
    const q = (document.getElementById("invBuscar").value||"").toLowerCase().trim();
    const est = document.getElementById("invEstado").value;
    const marca = document.getElementById("invMarca").value;
    const dias = document.getElementById("invDias").value;
    const filtrado = inv.filter(v=>{
      if(q && !((v.marca+" "+v.modelo+" "+v.id).toLowerCase().includes(q))) return false;
      if(est && v.estado!==est) return false;
      if(marca && v.marca!==marca) return false;
      if(dias){
        const [minS,maxS] = dias.split("-");
        const min = parseInt(minS,10), max = maxS==="+"?Infinity:parseInt(maxS,10);
        if(v.diasEnStock<min || v.diasEnStock>max) return false;
      }
      return true;
    });
    tbody.innerHTML = filtrado.map(filaInventario).join("") || `<tr><td colspan="10" class="empty">Ningún vehículo coincide con el filtro.</td></tr>`;
    if(contador) contador.textContent = filtrado.length+" de "+inv.length+" vehículo(s)";
  }
  ["invBuscar"].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener("input", aplicarFiltros); });
  ["invEstado","invMarca","invDias"].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener("change", aplicarFiltros); });
  aplicarFiltros();
  if(tabla){
    tabla.addEventListener("click", (e)=>{
      const tr = e.target.closest("[data-goficha]");
      if(tr){ window._fichaSelect = tr.getAttribute("data-goficha"); goTo("ficha"); }
    });
  }
}

  const facturacionActivos = activos.reduce((s,x)=>s+x.precioActual,0);

          </div>

          </div>
        </div>
        <div class="metric-row"><span class="k">Marca / modelo</span><span class="v">${esc(v.marca)} ${esc(v.modelo)}</span></div>
        <div class="metric-row"><span class="k">Año / versión</span><span class="v">${v.anio} · ${esc(v.version)}</span></div>
        <div class="metric-row"><span class="k">Kilometraje</span><span class="v">${v.km.toLocaleString("es-AR")} km</span></div>

            <div style="font-size:12px; color:var(--ink-2);">${esc(i.telefono)}${i.obs?" · "+esc(i.obs):""}</div>
          </div>`).join(""); })()}

}
function afterRenderFicha(){
  const picker = document.getElementById("fichaPicker");
  if(picker){
    picker.addEventListener("change", ()=>{ window._fichaSelect = picker.value; renderPane(); });
  }
  const inv = computeInventory();
  const v = inv.find(x=>x.id===window._fichaSelect);
  if(!v) return;

  const points = [{x:d(v.fechaIngreso), y:v.precioObjetivo, label:"Precio objetivo inicial"}]
    .concat(v.historial.map(p=>({x:d(p.fecha), y:p.nuevoPrecio, label:p.motivo})));
  if(v.estado==="Vendido"){ points.push({x:d(v.venta.fechaVenta), y:v.venta.precioFinal, label:"Venta"}); }
  const chartEl = document.getElementById("chartFicha");
  if(chartEl) lineChart(chartEl, points, {h:180});

  const input = document.getElementById("margenDeseado");
  const out = document.getElementById("precioSugerido");
  const outExacto = document.getElementById("precioExacto");
  const outDif = document.getElementById("diferenciaPrecio");
  const outAjuste = document.getElementById("ajustePrecio");
  const outG = document.getElementById("gananciaSugerida");
  const outGUSD = document.getElementById("gananciaSugeridaUSD");
  const outSentence = document.getElementById("simSentence");
  function updateSim(){
    let m = parseFloat(input.value);
    if(isNaN(m)) m = 0;
    m = Math.max(0, Math.min(90, m))/100;
    const exacto = v.costoTotal/(1-m);
    const precio = roundUp(exacto, DATA.config.redondeo);
    const ganancia = precio - v.costoTotal;
    const diferencia = precio - v.precioActual;
    const ajuste = v.precioActual ? diferencia/v.precioActual : 0;
    const recorte = v.costoTotal - v.precioActual*(1-m);
    out.textContent = fmtARS(precio);
    if(outExacto) outExacto.textContent = fmtARS(exacto);
    if(outDif) outDif.innerHTML = (diferencia>=0?"+":"")+fmtARS(diferencia);
    if(outAjuste) outAjuste.innerHTML = `<span style="color:${ajuste>0?'var(--critical)':'var(--good)'};">${ajuste>=0?"+":""}${fmtPct(ajuste)}</span>`;
    outG.textContent = fmtARS(ganancia);
    if(outGUSD) outGUSD.textContent = fmtUSD(ganancia/DATA.config.tipoCambio);
    if(outSentence){
      if(diferencia<=0){
        outSentence.textContent = `✅ Al precio actual (${fmtARS(v.precioActual)}) ya se alcanza ese margen: no hace falta subir precio.`;
      }else if(recorte>0){
        outSentence.textContent = `⚠️ Para lograr ${fmtPct(m,0)} hay que vender a ${fmtARS(precio)}: subir ${fmtARS(diferencia)} (${ajuste>=0?"+":""}${fmtPct(ajuste,0)}) o recortar ${fmtARS(recorte)} de costos manteniendo el precio actual.`;
      }else{
        outSentence.textContent = `⚠️ Para lograr ${fmtPct(m,0)} hay que vender a ${fmtARS(precio)}: subir ${fmtARS(diferencia)} (${ajuste>=0?"+":""}${fmtPct(ajuste,0)}).`;
      }
    }
  }
  if(input){ input.addEventListener("input", updateSim); updateSim(); }

  const fotoInputFicha = document.getElementById("fotoInputFicha");
  if(fotoInputFicha){
    fotoInputFicha.addEventListener("change", ()=>{
      const file = fotoInputFicha.files[0];
      if(!file) return;
      resizeImageToDataURL(file, 640, (dataUrl)=>{
        if(!dataUrl){ toast("No se pudo procesar la imagen"); return; }
        const veh = DATA.vehiculos.find(x=>x.id===v.id);
        if(veh){ veh.foto = dataUrl; saveData(); toast("Foto actualizada"); renderPane(); }
      });
    });
  }

  const finMonto = document.getElementById("finMonto");
  const finCuotas = document.getElementById("finCuotas");
  const finTasa = document.getElementById("finTasa");
  const finCuotaOut = document.getElementById("finCuota");
  const finTotalOut = document.getElementById("finTotal");
  const finInteresOut = document.getElementById("finInteres");
  function updateFin(){
    const monto = parseFloat(finMonto.value)||0;
    const cuotas = parseInt(finCuotas.value,10)||1;
    const tasa = (parseFloat(finTasa.value)||0)/100;
    const r = calcularCuota(monto, cuotas, tasa);
    finCuotaOut.textContent = fmtARS(r.cuota);
    finTotalOut.textContent = fmtARS(r.total);
    finInteresOut.textContent = fmtARS(r.interes);
  }
  if(finMonto && finCuotas && finTasa){
    [finMonto,finCuotas,finTasa].forEach(el=>el.addEventListener("input", updateFin));
    updateFin();
  }
}

function renderPrecios(){
  const inv = computeInventory().filter(v=>v.estado!=="Vendido");
  const historial = DATA.precios.slice().reverse().slice(0,60);
  const vigentePorVehiculo = {};
  DATA.precios.forEach(p=>{
    const actual = vigentePorVehiculo[p.idVehiculo];
    if(!actual || d(p.fecha)>d(actual.fecha)) vigentePorVehiculo[p.idVehiculo] = p;
  });
  return `
    <div class="card" style="padding:18px 20px; margin-bottom:16px;">
      <div class="section-title">Registrar cambio de precio</div>
      <div class="section-note">El precio anterior y la variación se calculan solos a partir del último precio vigente.</div>
      <form id="formPrecio">
        <div class="form-grid">
          <div class="field"><label>Vehículo</label><select required name="idVehiculo">${inv.map(v=>`<option value="${v.id}">${v.id} — ${esc(v.marca)} ${esc(v.modelo)} (actual ${fmtARS(v.precioActual)})</option>`).join("")}</select></div>
          <div class="field"><label>Fecha</label><input required type="date" name="fecha"></div>
          <div class="field"><label>Nuevo precio</label><input required type="number" name="nuevoPrecio" min="0" placeholder="21000000"></div>
        </div>
        <div class="field" style="margin-bottom:14px;"><label>Motivo</label><input required name="motivo" placeholder="Reducción para acelerar rotación"></div>
        <div class="form-actions">
          <button class="btn btn-accent" type="submit">Registrar precio</button>
          <span class="form-msg" id="msgPrecio"></span>
        </div>
      </form>
    </div>
    <div class="card table-wrap">
      <table>
        <thead><tr><th>ID</th><th>Vehículo</th><th>Fecha</th><th class="num">Precio anterior</th><th class="num">Nuevo precio</th><th class="num">Variación</th><th>Vigente</th><th>Motivo</th></tr></thead>
        <tbody>
          ${historial.map(p=>{
            const anteriores = DATA.precios.filter(x=>x.idVehiculo===p.idVehiculo && d(x.fecha)<d(p.fecha)).sort((a,b)=>d(b.fecha)-d(a.fecha));
            const veh = DATA.vehiculos.find(v=>v.id===p.idVehiculo);
            const anterior = anteriores.length? anteriores[0].nuevoPrecio : (veh?veh.precioObjetivo:null);
            const variacion = anterior? (p.nuevoPrecio/anterior - 1) : null;
            const esVigente = vigentePorVehiculo[p.idVehiculo] && vigentePorVehiculo[p.idVehiculo].id===p.id;
            return `<tr><td class="mono">${p.id}</td><td>${p.idVehiculo}</td><td>${fmtDate(p.fecha)}</td><td class="num">${fmtARS(anterior)}</td><td class="num">${fmtARS(p.nuevoPrecio)}</td><td class="num" style="color:${variacion<0?'var(--critical)':'var(--good)'};">${variacion!==null?fmtPct(variacion):"—"}</td><td>${esVigente?'<span class="pill pill-normal"><span class="dot"></span>Sí</span>':'<span class="pill pill-neutral">No</span>'}</td><td>${esc(p.motivo)}</td></tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
}
function afterRenderPrecios(){
  const form = document.getElementById("formPrecio");
  if(!form) return;
  form.addEventListener("submit", e=>{
    e.preventDefault();
    const f = new FormData(form);
    const id = uid("P", DATA.precios, "id");
    DATA.precios.push({id, idVehiculo:f.get("idVehiculo"), fecha:f.get("fecha"), nuevoPrecio:parseFloat(f.get("nuevoPrecio")), motivo:f.get("motivo").trim()});

      </table>
    </div>
  `;
}
function afterRenderInteresados(){
  const form = document.getElementById("formInteresado");
  if(!form) return;
  form.addEventListener("submit", e=>{
    e.preventDefault();
    const f = new FormData(form);
    const id = uid("I", DATA.interesados, "id");
    DATA.interesados.push({id, idVehiculo:f.get("idVehiculo"), nombre:f.get("nombre").trim(), telefono:f.get("telefono").trim(), fecha:f.get("fecha"), obs:f.get("obs").trim()});
    saveData();
    toast("Interesado "+id+" cargado");
    render();
  });
}

function afterRenderConfig(){
  document.getElementById("btnGuardarConfig").addEventListener("click", ()=>{
    document.querySelectorAll("[data-cfg]").forEach(inp=>{
      const key = inp.getAttribute("data-cfg");
      const pct = inp.getAttribute("data-pct")==="true";
      if(inp.getAttribute("data-raw")==="true"){ DATA.config[key] = inp.value; return; }
      let val = parseFloat(inp.value);
      if(isNaN(val)) return;
      DATA.config[key] = pct? val/100 : val;
    });
    saveData();
    toast("Configuración actualizada — todo el sistema se recalculó");
    document.getElementById("msgConfig").textContent = "Guardado ✓";
    setTimeout(()=>{ const m=document.getElementById("msgConfig"); if(m) m.textContent=""; },1800);
  });
  const btnIPC = document.getElementById("btnActualizarIPC");
  if(btnIPC){
    btnIPC.addEventListener("click", ()=>{
      const inp = document.getElementById("ipcProyeccionInput");
      const val = parseFloat(inp.value);
      if(isNaN(val)) return;
      DATA.config.ipcSerie[DATA.config.ipcSerie.length-1].variacion = val/100;
      saveData();
      toast("Proyección de IPC actualizada — se recalculó todo el sistema");
      render();
    });
  }

  document.querySelectorAll("[data-ref-del]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const idx = parseInt(b.getAttribute("data-ref-del"),10);
      DATA.referencias.splice(idx,1);
      saveData();
      toast("Fila quitada del VALOR DE REVISTA");
      render();
    });
  });
  const btnRefAgregar = document.getElementById("btnRefAgregar");
  if(btnRefAgregar){
    btnRefAgregar.addEventListener("click", ()=>{
      const marca = document.getElementById("refMarca").value.trim();
      const modelo = document.getElementById("refModelo").value.trim();
      const anio = parseInt(document.getElementById("refAnio").value,10);
      const precio = parseFloat(document.getElementById("refPrecio").value);
      if(!marca || !modelo || isNaN(anio) || isNaN(precio)){ toast("Completá marca, modelo, año y precio"); return; }
      DATA.referencias.push({marca, modelo, anio, precio});
      saveData();
      toast("Fila agregada al VALOR DE REVISTA");
      render();
    });
  }
  const btnRefGuardar = document.getElementById("btnRefGuardar");
  if(btnRefGuardar){
    btnRefGuardar.addEventListener("click", ()=>{
      document.querySelectorAll("[data-ref-idx]").forEach(inp=>{
        const idx = parseInt(inp.getAttribute("data-ref-idx"),10);
        const val = parseFloat(inp.value);
        if(!isNaN(val) && DATA.referencias[idx]) DATA.referencias[idx].precio = val;
      });
      saveData();
      toast("VALOR DE REVISTA actualizado");
      const m = document.getElementById("msgRef");
      if(m){ m.textContent = "Guardado ✓"; setTimeout(()=>{ if(m) m.textContent=""; },1800); }
    });
  }

  const btnBackup = document.getElementById("btnBackupDescargar");
  if(btnBackup){
    btnBackup.addEventListener("click", async ()=>{
      const json = JSON.stringify(DATA, null, 2);
      const fecha = todayDate().toISOString().slice(0,10);
      const ok = await tryDownloadsSave("backup_erp_autos_"+fecha+".json", json);
      const fallback = document.getElementById("backupFallback");
      if(ok){
        toast("Backup descargado");
        if(fallback) fallback.style.display = "none";
      }else{
        mostrarFallback(json);
      }
    });
  }
  const fechaArchivo = todayDate().toISOString().slice(0,10);
  const btnCsvInv = document.getElementById("btnCsvInventario");
  if(btnCsvInv) btnCsvInv.addEventListener("click", ()=>{
    const inv = computeInventory();
    descargarCSV("inventario_"+fechaArchivo+".csv",
      ["ID","Marca","Modelo","Año","Estado","Días en stock","Costo total","Precio actual","Ganancia estimada","Margen actual","Margen real (IPC)","Ganancia real USD","Diagnóstico"],
      inv.map(v=>[v.id,v.marca,v.modelo,v.anio,v.estado,v.diasEnStock,v.costoTotal,v.precioActual,v.gananciaEstimada,fmtPct(v.margenActual),v.margenRealIPC!==null?fmtPct(v.margenRealIPC):"",Math.round(v.gananciaRealIPCUSD),v.diagnostico])
    );
  });
  const btnCsvVeh = document.getElementById("btnCsvVehiculos");
  if(btnCsvVeh) btnCsvVeh.addEventListener("click", ()=>{
    descargarCSV("vehiculos_"+fechaArchivo+".csv",
      ["ID","Marca","Modelo","Año","Versión","Km","Fecha compra","Fecha ingreso","Precio compra","Precio objetivo","Estado","Observaciones"],
      DATA.vehiculos.map(v=>[v.id,v.marca,v.modelo,v.anio,v.version,v.km,v.fechaCompra,v.fechaIngreso,v.precioCompra,v.precioObjetivo,v.estado,v.obs])
    );
  });
  const btnCsvGas = document.getElementById("btnCsvGastos");
  if(btnCsvGas) btnCsvGas.addEventListener("click", ()=>{
    descargarCSV("gastos_"+fechaArchivo+".csv",
      ["ID","ID Vehículo","Fecha","Categoría","Descripción","Importe"],
      DATA.gastos.map(g=>[g.id,g.idVehiculo,g.fecha,g.categoria,g.desc,g.importe])
    );
  });
  const btnCsvPre = document.getElementById("btnCsvPrecios");
  if(btnCsvPre) btnCsvPre.addEventListener("click", ()=>{
    descargarCSV("precios_"+fechaArchivo+".csv",
      ["ID","ID Vehículo","Fecha","Nuevo precio","Motivo"],
      DATA.precios.map(p=>[p.id,p.idVehiculo,p.fecha,p.nuevoPrecio,p.motivo])
    );
  });
  const btnCsvVen = document.getElementById("btnCsvVentas");
  if(btnCsvVen) btnCsvVen.addEventListener("click", ()=>{
    descargarCSV("ventas_"+fechaArchivo+".csv",
      ["ID","ID Vehículo","Fecha venta","Precio final","Gastos finales","Cliente","Vendedor","Observaciones"],
      DATA.ventas.map(x=>[x.id,x.idVehiculo,x.fechaVenta,x.precioFinal,x.gastosFinales,x.cliente,x.vendedor,x.obs])
    );
  });
  const inputRestore = document.getElementById("inputRestore");
  if(inputRestore){
    inputRestore.addEventListener("change", ()=>{
      const file = inputRestore.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (e)=>{
        try{
          const parsed = JSON.parse(e.target.result);
          if(!parsed || !Array.isArray(parsed.vehiculos) || !parsed.config) throw new Error("formato inesperado");
          DATA = migrarData(parsed);
          saveData();
          toast("Datos restaurados desde el archivo");
          render();
        }catch(err){
          toast("El archivo no tiene el formato esperado — no se restauró nada");
        }
      };
      reader.readAsText(file);
    });
  }
}

   PANE DISPATCH
====================================================================== */
const RENDERERS = {
  dashboard: {render:renderDashboard, after:afterRenderDashboard},
  inventario:{render:renderInventario, after:afterRenderInventario},
  ficha:     {render:renderFicha, after:afterRenderFicha},
  vehiculos: {render:renderVehiculos, after:afterRenderVehiculos},
  gastos:    {render:renderGastos, after:afterRenderGastos},
  precios:   {render:renderPrecios, after:afterRenderPrecios},
  ventas:    {render:renderVentas, after:afterRenderVentas},
  interesados:{render:renderInteresados, after:afterRenderInteresados},
  config:    {render:renderConfig, after:afterRenderConfig},
};

function renderPane(){
  const panes = document.getElementById("panes");
  const r = RENDERERS[currentSection];
  panes.innerHTML = `<div class="pane">${r.render()}</div>`;
  if(r.after) r.after();
}

function render(){
  renderNav();
  const s = SECTIONS.find(x=>x.id===currentSection);
  document.getElementById("pagetitle").textContent = s.title;
  document.getElementById("pagesub").textContent = s.sub;
  renderPane();
  const inv = computeInventory();
  const capital = inv.filter(v=>v.estado!=="Vendido").reduce((s,v)=>s+v.capitalInmovilizado,0);
  document.getElementById("sidebarfoot").innerHTML = `Capital inmovilizado<br><strong style="color:var(--ink); font-family:'IBM Plex Mono',monospace;">${fmtARS(capital)}</strong>`;
  const fxBadge = document.getElementById("fxBadge");
  if(fxBadge) fxBadge.innerHTML = `<span class="dot" style="background:var(--accent);"></span>USD $${DATA.config.tipoCambio.toLocaleString("es-AR")} · ${fmtDate(DATA.config.fechaCotizacion)}`;
}

document.getElementById("btnReset").addEventListener("click", ()=>{
  if(confirm("Esto reemplaza los datos actuales por los datos de ejemplo originales. ¿Continuar?")) resetData();
});

render();
</script>
